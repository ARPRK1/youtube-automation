# ModernMonk 90-day monetization config.
# Target: YouTube Partner Program (1k subs + 4k watch hours OR 10M Shorts views / 90d).
# Strategy: PUBLIC Shorts-first, niche coherence, NOT made-for-kids, food+money+history.

video:
  # Shorts path is the realistic automation route to early views/subs.
  # 1 long + 6 Shorts = 7 uploads/day * 1600 units = 11,200 — slightly over
  # free 10k/day, so 1 long + 5 Shorts = 9,600 units (safe under 10k).
  long_count_per_day: 1
  long_min_minutes: 6
  long_max_minutes: 12
  shorts_count_per_day: 5
  # Winning Shorts on this channel were 25–45s. Cap hard so scripts stay punchy.
  shorts_max_seconds: 55

voice:
  provider: edge-tts
  edge_tts_voice: en-IN-NeerjaNeural
  # en-IN voices convert better for India-topic content (audience is IN).
  # Fallback if missing on runner: orchestrator/tts should still work with en-US.
  kokoro_voice: af_heart
  reference_sample: voice-sample/reference.wav
  chatterbox_exaggeration: 0.5

topics:
  # Focused mode: bias research toward niches that already got 500–1k+ views
  # on this channel (food origin, money, history twist, places). Still uses
  # live trends, but scores proven-niche candidates higher.
  mode: growth-focused
  avoid_repeat_days: 21
  primary_niches:
    - indian-food-story
    - indian-money-simple
    - india-history-twist
    - india-place-secret
  sources:
    google_trends_india: true
    google_news: true
    youtube_trending: true
    reddit: false

script:
  min_long_words: 1000
  target_long_words: 1600
  # Shorts spoken length ~ 80–120 words at 200 wpm ≈ 25–35s
  min_short_words: 70
  max_short_words: 130
  words_per_minute: 200
  structures: [story-led, question-led, countdown, mystery]
  # Inject growth hooks / CTA directives into LLM prompts
  growth_mode: true

media:
  min_resolution_landscape: [1920, 1080]
  min_resolution_vertical: [1080, 1920]
  allowed_licenses: [pd, cc0, by, by-sa]
  ai_fallback_enabled: true
  verify_relevance: true

upload:
  enabled: true
  # CRITICAL: unlisted = zero algorithm. Public is required for growth.
  privacy_status: public
  # Never mark as made for kids (channel-level was killing reach/comments).
  made_for_kids: false
  # Education (27) is fine for long; Shorts often perform as Entertainment (24)
  # or People & Blogs (22). We set per-kind in code.
  category_id_long: '27'
  category_id_short: '24'
  channel_id: UCv8n_ykbynzj6-gwdwX6loA
  channel_handle: modernmonkshot

paths:
  runs_dir: runs
  ready_to_upload_dir: ready_to_upload

growth:
  # Soft targets used only for logging / daily report (not hard fails).
  target_subs_90d: 1000
  target_shorts_views_90d: 10000000
  daily_shorts_view_goal: 120000
