# ModernMonk 90-day monetization config.
# Updated 2026-08-12 after post-pivot audit + owner feedback on voice quality.

video:
  # Shorts-first growth. Long is optional session fuel — skip if clone TTS
  # budget is tight (see voice.long_provider). 5 Shorts * 1600 = 8000 units.
  long_count_per_day: 0
  long_min_minutes: 6
  long_max_minutes: 12
  shorts_count_per_day: 5
  # Post-pivot winners: 32–45s. Reject stubs (7s/13s still leaked Aug 5–8).
  shorts_min_seconds: 28
  shorts_max_seconds: 50
  whiteboard_reveal_enabled: true

voice:
  # OWNER REQUEST 2026-08-12: own cloned voice — edge neural was not
  # watchable. Chatterbox zero-shot clone uses voice-sample/reference.wav.
  # Shorts only: ~450 words/day * ~4s/word ≈ 30 min TTS (fits free runners).
  # Long stays edge-tts if re-enabled (clone on long would alone need ~100 min).
  provider: chatterbox
  shorts_provider: chatterbox
  long_provider: edge-tts
  edge_tts_voice: en-IN-NeerjaNeural
  kokoro_voice: af_heart
  reference_sample: voice-sample/reference.wav
  # Slightly more expressive than default 0.5 for faceless Shorts energy.
  chatterbox_exaggeration: 0.55

topics:
  mode: growth-focused
  avoid_repeat_days: 28
  primary_niches:
    - indian-food-story
    - india-history-twist
    - india-place-secret
  sources:
    google_trends_india: true
    google_news: true
    youtube_trending: false
    reddit: false

script:
  min_long_words: 1100
  target_long_words: 1500
  # ~80–110 words ≈ 28–45s at ~150–170 wpm (cloned speech often slightly slower).
  min_short_words: 80
  max_short_words: 110
  words_per_minute: 160
  structures: [story-led, question-led, countdown, mystery]
  growth_mode: true

media:
  min_resolution_landscape: [1920, 1080]
  min_resolution_vertical: [1080, 1920]
  allowed_licenses: [pd, cc0, by, by-sa]
  ai_fallback_enabled: true
  verify_relevance: true
  # hybrid: real food photos when possible (vision quota can 429 — AI still ok).
  mode: hybrid
  visual_beat_seconds_short: 3.0
  visual_beat_seconds_long: 4.8
  max_visual_beats_short: 14
  max_visual_beats_long: 16

music:
  enabled: true
  shorts: false
  long_min_seconds: 100
  volume_db: -18

upload:
  enabled: true
  privacy_status: public
  made_for_kids: false
  category_id_long: '27'
  category_id_short: '24'
  channel_id: UCv8n_ykbynzj6-gwdwX6loA
  channel_handle: modernmonkshot

paths:
  runs_dir: runs
  ready_to_upload_dir: ready_to_upload

growth:
  target_subs_90d: 1000
  target_shorts_views_90d: 10000000
  daily_shorts_view_goal: 50000
