# ModernMonk — Universal curiosity Shorts (owner pivot 2026-08-12).
# Brand: one sharp fact / top-5 / history twist / quiz a day.
# Quality > speed: script-matched visuals, no random faces, clone voice on Shorts.

video:
  long_count_per_day: 0
  long_min_minutes: 6
  long_max_minutes: 12
  shorts_count_per_day: 5
  # Includes ~2s end hold + sentence pauses (spoken body still ~28–45s).
  shorts_min_seconds: 28
  shorts_max_seconds: 58
  whiteboard_reveal_enabled: true
  # Big bold on-screen hook card for the first N seconds of a Short (the
  # scroll-stopper). Uses the curiosity title. Self-falls-back if it can't render.
  hook_overlay_enabled: true
  hook_overlay_seconds: 2.6

voice:
  provider: chatterbox
  # Shorts voice. 'chatterbox' = the owner's cloned voice (consistent per-
  # sentence synthesis). To A/B a reliable, perfectly consistent MALE voice
  # instead, set: shorts_provider: edge-tts  (it will use edge_tts_male_voice).
  shorts_provider: chatterbox
  long_provider: edge-tts
  # Female neural fallback (long-form + chatterbox failure fallback).
  edge_tts_voice: en-IN-NeerjaNeural
  # Male voice used when shorts_provider is edge-tts. en-US-ChristopherNeural
  # is warm/consistent; en-US-AndrewNeural and en-IN-PrabhatNeural also good.
  edge_tts_male_voice: en-US-ChristopherNeural
  kokoro_voice: af_heart
  reference_sample: voice-sample/reference.wav
  # Curated clean 8–15s slice of the owner's voice, auto-preferred when present.
  # Build it with: npm run voice:prepare-reference  (writes this file).
  # A short clean take clones STYLE far better than the raw 57s clip.
  reference_clean_sample: voice-sample/reference-clean.wav
  # Prosody (ResembleAI): higher exaggeration = ups/downs; lower cfg = slower/deliberate.
  # These are the BASE values; the beat planner (lib/speech-performance.js)
  # nudges each beat around them (hook = punchier, reveal = more lift + pause,
  # cta = calmer). Owner feedback 2026-08-12: was flat + fast "reading text".
  chatterbox_exaggeration: 0.72
  chatterbox_cfg_weight: 0.30
  chatterbox_temperature: 0.85
  # Extra slowdown after synth (atempo, pitch preserved). 0.90 ≈ 10% slower.
  speech_rate: 0.90
  # Base pause between sentences (ms). Overridden per beat by the planner.
  sentence_pause_ms: 360
  # Hold after last word before cut (seconds). Owner asked for ~2s.
  end_silence_sec: 2.0
  # Split Shorts narration into sentences for separate prosody curves.
  sentence_split: true
  # Performance beats: per-beat hook/reveal/cta/breath prosody + variable
  # pauses (the P0 structural fix, not just config tuning). Shorts only.
  beat_performance_enabled: true
  # EBU R128 loudness normalization so every Short sits at a steady, present
  # level (Chatterbox output level drifts with exaggeration/reference).
  loudnorm_enabled: true

topics:
  mode: growth-focused
  avoid_repeat_days: 28
  # Locale for Google News fact corroboration + YouTube trending. Global
  # curiosity channel → US (broadest English feed). Was IN (India) pre-pivot.
  region: US
  primary_niches:
    - world-facts
    - top-lists
    - history-twist
    - science-curiosity
    - mind-quiz
    - indian-food-story
  sources:
    google_trends_india: false
    google_news: true
    youtube_trending: false
    reddit: false

script:
  min_long_words: 1100
  target_long_words: 1500
  # Fewer words: slower clone + pauses + 2s end hold still fit under 50s.
  # ~70–95 words at ~140 wpm spoken + pauses ≈ 32–45s + 2s hold.
  min_short_words: 70
  max_short_words: 95
  words_per_minute: 140
  structures: [story-led, question-led, countdown, mystery]
  growth_mode: true

media:
  min_resolution_landscape: [1920, 1080]
  min_resolution_vertical: [1080, 1920]
  allowed_licenses: [pd, cc0, by, by-sa]
  ai_fallback_enabled: true
  verify_relevance: true
  # Also vision-check the ANCHOR AI image of each segment (not just real
  # stock). Closes the old "AI is relevant by construction" gap that let
  # mismatched/random-people AI frames ship unchecked.
  verify_ai_primary: true
  # Vision-check EVERY AI filler beat too (not just the anchor) and replace any
  # frame that shows a person with a safe real image. This is the hard
  # enforcement of never_people across the whole Short (owner QA 2026-08-14:
  # a random female sketch slipped into a goldfish video via an unchecked beat).
  verify_ai_beats: true
  # Prefer real stock for concrete objects/places; AI only for diagrams.
  # never_people: hard ban on prominent human faces — enforced on BOTH AI
  # generation AND real stock (vision hasPerson). Random faces = slop.
  mode: hybrid
  never_people: true
  prefer_real_stock: true
  # Human-made look: fewer AI style thrash cuts; longer holds on real photos.
  visual_beat_seconds_short: 3.8
  visual_beat_seconds_long: 5.0
  max_visual_beats_short: 10
  max_visual_beats_long: 14
  # Reuse real stills with different Ken Burns before generating new AI faces.
  prefer_reuse_real_over_ai: true
  # Animation-first (owner 2026-08-14): prefer real MOTION video b-roll over
  # still images for each beat; fall back to stills when no clip is found or a
  # beat can't use one. max_broll_entities caps the extra per-segment sourcing.
  prefer_video: true
  max_broll_entities: 4

music:
  enabled: true
  shorts: false
  long_min_seconds: 100
  volume_db: -18

upload:
  enabled: true
  privacy_status: public
  made_for_kids: false
  category_id_long: '27'
  category_id_short: '24'
  channel_id: UCv8n_ykbynzj6-gwdwX6loA
  channel_handle: modernmonkshot

paths:
  runs_dir: runs
  ready_to_upload_dir: ready_to_upload

growth:
  target_subs_90d: 1000
  target_shorts_views_90d: 10000000
  daily_shorts_view_goal: 50000
