name: Chatterbox voice clone test (manual, isolated)

# Standalone validation for the Chatterbox TTS zero-shot voice-cloning
# integration (lib/chatterbox-tts.js, scripts/chatterbox_server.py) -- NOT
# wired into the daily job. Synthesizes a short throwaway phrase directly
# in the cloned voice and uploads it so it can be listened to before this
# ever touches a real video or the live channel.
#
# Replaces an earlier OpenVoice V2 attempt (tone-color conversion on top
# of edge-tts output) that produced audio confirmed NOT to sound like the
# target voice -- conversion only re-colors an existing recording's
# timbre and leaves the source TTS's own accent/cadence untouched.
# Chatterbox does true synthesis in the target voice instead.

on:
  workflow_dispatch: {}

jobs:
  test-clone:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install torch (CPU) and Chatterbox
        # Chatterbox's own pyproject.toml pins torch==2.6.0 /
        # torchaudio==2.6.0 exactly -- installing both together from the
        # CPU index (not letting torchaudio resolve separately/later) is
        # what avoided the CUDA-linked torchaudio problem hit during the
        # OpenVoice attempt. gradio is a hard pin in Chatterbox's deps but
        # is only its demo UI -- installing the actual runtime deps
        # manually and the package itself with --no-deps skips it.
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install librosa==0.11.0 s3tokenizer transformers==5.2.0 diffusers==0.29.0 \
            conformer==0.3.2 safetensors==0.5.3 spacy-pkuseg pykakasi==2.3.0 pyloudnorm omegaconf
          pip install "git+https://github.com/resemble-ai/Perth.git@master"
          pip install chatterbox-tts --no-deps

      - name: Synthesize a realistic-length test paragraph directly in the cloned voice
        # ~180 words -- close to a real long-form segment's length -- so the
        # wall-clock time here (vs. this file's own start/end timestamps)
        # gives a real CPU-inference words/sec rate to size daily.yml's
        # timeout against, instead of guessing from the old 28-word phrase.
        run: |
          date -u +"START %Y-%m-%dT%H:%M:%SZ"
          echo '{"text": "Here is a longer test paragraph, closer to what a real video segment sounds like, so we can measure how long the cloned voice actually takes to render on this machine. Quantum entanglement is one of the strangest ideas in physics. When two particles become entangled, measuring one instantly tells you something about the other, no matter how far apart they are. Einstein called this spooky action at a distance because it seemed to break the speed limit of the universe. But nothing is actually being sent between the particles faster than light. The correlation was built in the moment they became entangled, like two coins that always land on opposite sides no matter how far apart you flip them. If this sounds like my own voice and the timing works out, the cloning pipeline is ready for real production videos.", "output": "/tmp/test-cloned.wav", "reference": "voice-sample/reference.wav"}' | python scripts/chatterbox_server.py | tee /tmp/server.log
          date -u +"END %Y-%m-%dT%H:%M:%SZ"

      - name: Upload cloned test clip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatterbox-test-output
          path: |
            /tmp/test-cloned.wav
            /tmp/server.log
          if-no-files-found: warn
          retention-days: 7
