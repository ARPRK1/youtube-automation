name: Daily video generation

on:
  schedule:
    # 12:30 UTC = 6:00 PM IST (2026-07-29: moved earlier at the user's
    # request so a failed run still leaves troubleshooting time same
    # evening, IST). Off the hour to dodge the on-the-hour cron pile-up.
    - cron: '30 12 * * *'
  workflow_dispatch:
    inputs:
      long_only:
        description: 'Backfill mode: generate long-form videos only, skip shorts'
        type: boolean
        default: false
      long_count:
        description: 'Backfill mode: override number of long-form videos to generate (blank = config default)'
        type: string
        default: ''
      short_count:
        description: 'Backfill mode: override number of Shorts to generate (blank = config default of 5)'
        type: string
        default: ''
      niche:
        description: 'Pin pillar: world-facts, top-lists, history-twist, science-curiosity, mind-quiz, indian-food-story. Blank = daily rotation.'
        type: string
        default: ''
      topic:
        description: 'Pin an exact topic (skips daily research). Use with long_only=true + long_count=1 for a flagship long video.'
        type: string
        default: ''

# Confirmed live: run #52 (workflow_dispatch, 2026-07-29T16:33:53Z, SUCCESS,
# 2h6m59s) was still in progress when #53 (schedule, 2026-07-30T14:38:25Z)
# fired on the same commit and failed. Two overlapping runs both hit
# YouTube's daily upload cap and free-tier LLM quota at the same time,
# doubling the chance either one starves the other -- not confirmed as the
# exact cause of #53 specifically (see the RCA in the 2026-08-02 report),
# but a real, avoidable failure mode regardless. cancel-in-progress: false
# on purpose -- a half-finished ~2 hour render is worth more than a fresh
# start, so a new trigger queues behind it rather than killing it.
concurrency:
  group: daily-video-generation
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    # contents: write so the "park failed uploads to a branch" step below
    # can push -- default GITHUB_TOKEN permissions vary by repo/org setting
    # and shouldn't be relied on to already include write access.
    permissions:
      contents: write
    # Raised again after the first live AI-only-mode run (2026-07-25,
    # run 30140563750): it succeeded but finished in 98.65 of the 100 min
    # ceiling -- 1.35 min of margin, effectively the same razor-thin-timeout
    # risk this mode was built to fix. The AI-only path did remove the old
    # vision-verify LLM chain (confirmed: zero vision-check calls in that
    # run's log), but per-beat AI image generation itself is still a real,
    # sequential network call per beat, and a 75-beat/7-segment long video
    # alone took 57 of the 98 minutes. Since a GitHub Actions timeout costs
    # nothing unless actually hit, widening the ceiling is the safe lever
    # here rather than cutting visual beat count/quality without being
    # asked to. (Chatterbox cloned-voice TTS was evaluated the same day and
    # deferred -- ~3.7-4.4s of CPU compute per word on this runner would
    # mean ~130-150 min of TTS alone for a full day's narration. That
    # deferral was originally reasoned on a false premise: this repo was
    # private and believed to meter Actions minutes at the time. Confirmed
    # public now (`gh repo view --json visibility` -> PUBLIC); runs #42/#43
    # failing instantly with no runner assigned at 03:33-03:38 UTC on
    # 2026-07-27, then #44 succeeding normally at 04:13 UTC the same day,
    # is consistent with the visibility flip landing in that window. Actions
    # minutes are free on a public repo, so that constraint is void; see
    # config.yaml's voice: block and Phase 5 of CLAUDE-CODE-BRIEF for the
    # current plan to re-evaluate Chatterbox.)
    # 2026-08-12: Chatterbox clone on Shorts adds ~30–50 min TTS after cold
    # model load. Public repo = free minutes; 240 keeps margin for hybrid media.
    timeout-minutes: 240

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and Chromium system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2 \
            fonts-dejavu-core fonts-liberation

      - name: Install edge-tts (long-form / chatterbox fallback)
        run: pip install edge-tts

      - name: Install Chatterbox voice clone (Shorts primary voice)
        # Same recipe as chatterbox-test.yml (verified success 2026-07-24).
        # CPU torch + chatterbox --no-deps (skip gradio UI). Model loads once
        # per run via scripts/chatterbox_server.py.
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install librosa==0.11.0 s3tokenizer transformers==5.2.0 diffusers==0.29.0 \
            conformer==0.3.2 safetensors==0.5.3 spacy-pkuseg pykakasi==2.3.0 pyloudnorm omegaconf
          pip install "git+https://github.com/resemble-ai/Perth.git@master"
          pip install chatterbox-tts --no-deps
          test -f voice-sample/reference.wav && echo "Reference voice sample present ($(wc -c < voice-sample/reference.wav) bytes)" || (echo "MISSING voice-sample/reference.wav" && exit 1)

      - name: Install Node dependencies
        run: npm install

      - name: Build curated clean voice reference (better clone prompt)
        # Extracts a clean 8–15s continuous slice of voice-sample/reference.wav
        # to voice-sample/reference-clean.wav, which lib/tts.js auto-prefers.
        # A short clean take clones the owner's STYLE far better than the raw
        # ~57s clip. Non-fatal: TTS falls back to the raw reference if this
        # can't produce a clip, so a bad trim never breaks the run.
        continue-on-error: true
        run: node scripts/prepare-reference-voice.mjs

      - name: Install Chromium dependencies for Remotion
        run: npx remotion browser ensure

      - name: Generate and upload today's videos
        run: |
          # Build args as a bash ARRAY and read the free-text inputs from env
          # vars (never interpolate ${{ inputs.* }} directly into the command) —
          # otherwise a multi-word topic like "10 places on Earth..." splits on
          # spaces and only "--topic=10" reaches node (confirmed live 2026-08-18:
          # the flagship got written about the number 10). Quoting via the array
          # keeps the whole topic/niche intact.
          ARGS=()
          if [ "${{ inputs.long_only }}" = "true" ]; then ARGS+=(--long-only); fi
          if [ -n "${{ inputs.long_count }}" ]; then ARGS+=("--long-count=${{ inputs.long_count }}"); fi
          if [ -n "${{ inputs.short_count }}" ]; then ARGS+=("--short-count=${{ inputs.short_count }}"); fi
          if [ -n "$INPUT_NICHE" ]; then ARGS+=("--niche=$INPUT_NICHE"); fi
          if [ -n "$INPUT_TOPIC" ]; then ARGS+=("--topic=$INPUT_TOPIC"); fi

          # A scheduled run gets exactly one attempt; every failure examined
          # in the 2026-08-02 RCA (India-trends leak, thin-topic repetition,
          # a near-miss duration gate) is the kind of thing a second attempt
          # can plausibly land differently on, and manual re-runs of the
          # identical commit have repeatedly succeeded (#52 succeeded on the
          # same commit #53 failed on, ~26 min apart). One retry only, and
          # ONLY if the first attempt failed fast enough that nothing could
          # have uploaded yet -- uploads happen progressively during
          # generation, so retrying after a late-stage failure risks
          # republishing videos that already went live. A duplicate on the
          # channel is worse than a missed day. 600s is well under the
          # ~35s-to-several-minutes it takes every observed early failure
          # (Groq/topic-research/script-write stage) to surface, and well
          # under the time it takes to reach the first possible upload.
          SAFE_RETRY_WINDOW_SECONDS=600
          START=$(date +%s)
          if node orchestrator.js "${ARGS[@]}"; then
            exit 0
          fi
          ELAPSED=$(( $(date +%s) - START ))
          if [ "$ELAPSED" -lt "$SAFE_RETRY_WINDOW_SECONDS" ]; then
            echo "First attempt failed after ${ELAPSED}s (under the ${SAFE_RETRY_WINDOW_SECONDS}s safe-retry window) -- retrying once."
            sleep 60
            node orchestrator.js "${ARGS[@]}"
          else
            echo "First attempt failed after ${ELAPSED}s -- past the safe-retry window, not retrying: a late failure may have already uploaded, and a blind retry risks a duplicate upload."
            exit 1
          fi
        env:
          PYTHON_BIN: python
          # Free-text inputs via env (quoted in the array above) so multi-word
          # values survive intact.
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_NICHE: ${{ inputs.niche }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Hard-fail if OAuth is bound to any channel other than ModernMonkShot
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          YOUTUBE_CHANNEL_HANDLE: modernmonkshot
          # Public is required for algorithm / YPP watch hours. Override only for testing.
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'public' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

      - name: Upload run output as build artifact
        # continue-on-error: a full successful generation day must not be
        # painted red solely because the free-tier artifact storage quota
        # is exhausted (confirmed live in Daily #13 and later runs:
        # "Failed to CreateArtifact: Artifact storage quota has been hit").
        # Videos already land in ready_to_upload/ on the runner; the
        # artifact is a convenience, not the source of truth.
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          # Only ready_to_upload/** (final videos + thumbnails + metadata
          # for anything that failed the quality gate or upload) -- this
          # used to also include runs/** (every stage's intermediate
          # files: per-segment audio clips, unfinished background renders,
          # thumb sources, individual caption files -- ~15 files per video
          # beyond the one that actually matters). That bloat, accumulated
          # over 14 days of retention at ~1GB/run, blew through the
          # account's Actions artifact storage quota outright and started
          # failing artifact uploads entirely (confirmed live: "Artifact
          # storage quota has been hit", with usage only recalculated
          # every 6-12 hours after cleanup -- not something a same-run fix
          # can route around). retention-days cut from 14 to 3 for the
          # same reason: less accumulation, less chance of hitting this
          # again.
          path: ready_to_upload/**
          retention-days: 3
          if-no-files-found: warn

      - name: Push any parked (failed-upload) videos to a durable branch
        # Confirmed live (2026-07-25, run 30140563750): the artifact-upload
        # step above failed on the storage-quota-recalculation-lag quirk
        # documented there, and the two parked videos from that run were
        # unrecoverable -- the runner that had them was already destroyed by
        # the time the failure was noticed, and the Actions artifact was
        # never created. Regular git storage isn't subject to that same
        # quota-lag quirk, so this is a second, independent path to the
        # user's own machine: `git fetch origin parked-videos && git checkout
        # parked-videos` (or `git pull` if already on that branch) in a
        # local clone pulls today's parked videos straight in for manual
        # upload. Runs even if the step above succeeded -- cheap belt-and-
        # suspenders, and this is the only path that survives the quota-lag
        # window.
        if: always()
        continue-on-error: true
        run: |
          SRC_DIR=$(find ready_to_upload -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -1)
          if [ -z "$SRC_DIR" ] || [ -z "$(ls -A "$SRC_DIR" 2>/dev/null)" ]; then
            echo "No parked videos to push."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stash the parked files outside the repo working tree before
          # switching branches -- ready_to_upload/ is gitignored, and an
          # orphan checkout can otherwise interact oddly with untracked
          # ignored directories.
          STAGE=$(mktemp -d)
          cp -r "$SRC_DIR" "$STAGE/"

          # Discard any tracked-file changes from earlier steps (confirmed
          # live 2026-07-25: `npm install` leaves package-lock.json locally
          # modified, which made `git checkout -B ... origin/parked-videos`
          # abort with "commit your changes or stash them" -- costing a real
          # produced-and-parked video its only recovery path, the exact
          # failure this whole step exists to prevent). Safe to discard
          # unconditionally here: everything this job needs from the
          # working tree is already captured in $STAGE above.
          git reset --hard HEAD >/dev/null

          if git ls-remote --exit-code --heads origin parked-videos >/dev/null 2>&1; then
            git fetch origin parked-videos
            git checkout -B parked-videos origin/parked-videos
          else
            git checkout --orphan parked-videos
            git rm -rf . >/dev/null 2>&1 || true
          fi

          # `mkdir -p` + trailing `/.` on the cp source merges into an
          # existing same-date folder instead of nesting inside it --
          # confirmed live 2026-07-27: two separate runs parking videos on
          # the same calendar date produced parked/2026-07-27/2026-07-27/...
          # because `cp -r src dst` nests src inside an already-existing
          # dst rather than merging its contents.
          DEST="parked/$(basename "$SRC_DIR")"
          mkdir -p "$DEST"
          cp -r "$STAGE/$(basename "$SRC_DIR")/." "$DEST/"

          # Regular git has a hard 100MB per-file limit -- a long-form
          # video routinely exceeds that (confirmed live 2026-07-27: a
          # 142MB long video got the whole push rejected with "GH001:
          # Large files detected", which would otherwise silently cost
          # every OTHER file in the same commit their recovery path too,
          # not just the oversized one). Drop anything too big for git
          # specifically; the artifact-upload step above has no such limit
          # and is still the recovery path for these.
          find "$DEST" -type f -size +95M -print | while IFS= read -r big; do
            echo "Skipping $big for the git branch (over git's 100MB limit) -- rely on the Actions artifact for this one."
            rm -f "$big"
          done
          if [ -z "$(find "$DEST" -type f 2>/dev/null)" ]; then
            echo "Everything for $(basename "$SRC_DIR") was over git's size limit -- nothing left to push here, rely on the Actions artifact."
            exit 0
          fi

          git add -f "$DEST"
          git commit -m "Parked videos from run ${{ github.run_id }} ($(basename "$SRC_DIR"))" || { echo "Nothing new to commit."; exit 0; }
          git push origin parked-videos
          echo "Pushed parked videos to the parked-videos branch -- pull it locally to upload manually."
