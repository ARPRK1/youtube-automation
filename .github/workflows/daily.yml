name: Daily video generation

on:
  schedule:
    # 03:33 UTC = 9:03am IST. Off the hour to avoid the midnight cron pile-up.
    - cron: '33 3 * * *'
  workflow_dispatch:
    inputs:
      long_only:
        description: 'Backfill mode: generate long-form videos only, skip shorts'
        type: boolean
        default: false
      long_count:
        description: 'Backfill mode: override number of long-form videos to generate (blank = config default)'
        type: string
        default: ''

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg and Chromium system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
            libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libasound2t64 libpango-1.0-0 libcairo2

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Install Node dependencies
        run: npm install

      - name: Install Chromium dependencies for Remotion
        run: npx remotion browser ensure

      - name: Generate and upload today's videos
        run: |
          ARGS=""
          if [ "${{ inputs.long_only }}" = "true" ]; then ARGS="$ARGS --long-only"; fi
          if [ -n "${{ inputs.long_count }}" ]; then ARGS="$ARGS --long-count=${{ inputs.long_count }}"; fi
          node orchestrator.js $ARGS
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'unlisted' }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}

      - name: Upload run output as build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos-${{ github.run_id }}
          # The 6-stage pipeline writes to runs/<date>/ (scripts, research,
          # manifest, rendered clips) and ready_to_upload/<date>/ (anything
          # that failed the quality gate or upload) -- the old output/**
          # path was left over from before that restructure and silently
          # uploaded nothing ("No files were found with the provided
          # path"), confirmed live on the first real Actions run.
          path: |
            runs/**
            ready_to_upload/**
          retention-days: 14
