name: Visuals module direct test (manual, throwaway)
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install deps
        run: npm install
      - name: Run renderVisualTimeline with 15 synthetic gradient items
        run: |
          node -e "
          import('./lib/visuals.js').then(async ({ renderVisualTimeline }) => {
            const items = Array.from({ length: 15 }, (_, i) => ({ type: 'gradient', durationSec: 3 + (i % 3), seed: 'seg' + i }));
            try {
              await renderVisualTimeline({ items, aspect: 'landscape', outPath: 'out-real.mp4', seed: 'realtest' });
              console.log('OK: renderVisualTimeline with 15 items');
            } catch (err) {
              console.log('FAILED: ' + err.message);
              process.exit(1);
            }
          });
          "
