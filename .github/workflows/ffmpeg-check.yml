name: FFmpeg xfade capability check (manual, throwaway)
on:
  workflow_dispatch: {}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Chain 5 clips with each candidate transition type
        run: |
          for i in 0 1 2 3 4; do
            ffmpeg -y -f lavfi -i "color=c=red:s=320x240:d=2" -c:v libx264 -pix_fmt yuv420p clip$i.mp4
          done
          for t in fade wipeleft wiperight wipeup wipedown slideleft slideright slideup slidedown; do
            echo "=== testing $t ==="
            ffmpeg -y -i clip0.mp4 -i clip1.mp4 -i clip2.mp4 -i clip3.mp4 -i clip4.mp4 \
              -filter_complex "[0:v][1:v]xfade=transition=$t:duration=0.4:offset=1.6[m1];[m1][2:v]xfade=transition=$t:duration=0.4:offset=3.2[m2];[m2][3:v]xfade=transition=$t:duration=0.4:offset=4.8[m3];[m3][4:v]xfade=transition=$t:duration=0.4:offset=6.4[outv]" \
              -map "[outv]" -pix_fmt yuv420p -c:v libx264 -preset veryfast -crf 20 -t 8 "out-$t.mp4" \
              && echo "OK: $t" || echo "FAILED: $t"
          done
